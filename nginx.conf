# ZEEKR Paraguay — sitio estático (Coolify → Traefik → este nginx)
#
# De dónde sale el sitio (desde el 25/09/2026):
# 1. /srv/sites/zeekr/current — lo último que se publicó con el botón "Publicar" del panel (/admin).
#    El builder (app Coolify "zeekr-builder") escribe las releases en el volumen docker zeekr_sites, que esta
#    app monta en /srv/sites (tiene que ser esa ruta: current y preview son symlinks ABSOLUTOS a
#    /srv/sites/zeekr/releases/…). nginx sigue el symlink en cada pedido: publicar o volver atrás no
#    necesita reiniciar ni redesplegar nada.
# 2. /usr/share/nginx/html — copia del repo que viene dentro de la imagen (red de seguridad). Se usa archivo
#    por archivo cuando algo no está en la release, y entera si el volumen no está montado o todavía no hay
#    ninguna publicación. Así ninguna URL que funcionaba antes da 404: los derivados viejos
#    images/_opt/{hero,menu,zeekr7x,…} que siguen en caché de buscadores y redes, las fotos sueltas de la raíz.
#    Ojo: por lo mismo, una página que se saque del panel sigue saliendo de esta copia hasta que se quite del repo.
# Cada location que sirve archivos cae en su @baked_* con las mismas cabeceras que tendría servido de la
# release: add_header no se hereda si el bloque define alguna, y un named location no ve las del location
# desde el que se saltó.

# El alias de staging no debe indexarse; solo el dominio real.
map $host $robots_tag {
    default                 "noindex, nofollow";
    zeekrlife.com.py        "";
    www.zeekrlife.com.py    "";
}

# WebSocket del panel (/cms/): "Connection: upgrade" solo cuando el cliente lo pide
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # default_server: este bloque atiende zeekrlife.com.py, www, el alias zeekr.santarosa.lat y cualquier Host
    # sin server propio (el healthcheck pide 127.0.0.1). Los hosts con server propio van más abajo.
    listen 80 default_server;
    server_name _;
    root /srv/sites/zeekr/current;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml application/manifest+json image/svg+xml text/plain;

    # Cabeceras de seguridad (se repiten por bloque: add_header no se hereda si el location define alguna)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag $robots_tag always;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json text/plain text/xml application/xml image/svg+xml;

    error_page 404 /404.html;
    location = /404.html { internal; try_files $uri @baked_error; }
    location ~ ^/(en|pt|zh)/404\.html$ { internal; try_files $uri @baked_error; }
    location ~ ^/(?<lang>en|pt|zh)/ {
        error_page 404 /$lang/404.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/ @baked_lang;
    }

    # /index.html y /carpeta/index.html pedidos explícitamente → URL canónica (el index interno no redirige)
    location ~ ^(?<dir>.*/)index\.html$ {
        if ($request_uri ~ "^[^?]*/index\.html") { return 301 $dir; }
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri @baked_html;
    }

    # Archivos del generador / de Pages nunca se sirven
    location ~ \.(?:py|toml|md|lock|mjs)$ { return 404; }
    location ~ ^/(?:functions|api)/ { return 404; }
    location ~ ^/_(?:headers|redirects)$ { return 404; }

    # Redirecciones 301 desde las URLs del sitio anterior
    location = /zeekr001.html   { return 301 /modelos/zeekr-001/; }
    location = /zeekrx.html     { return 301 /modelos/zeekr-x/; }
    location = /zeekr7x.html    { return 301 /modelos/zeekr-7x/; }
    location = /noticias.html   { return 301 /noticias/; }
    location = /nosotros.html   { return 301 /nosotros/; }
    # Sitio anterior en DreamHost (PHP): mismas equivalencias que LEGACY_PHP en build_site.py
    location = /index.php       { return 301 /; }
    location = /zeekr001.php    { return 301 /modelos/zeekr-001/; }
    location = /zeekrx.php      { return 301 /modelos/zeekr-x/; }
    location = /zeekr7x.php     { return 301 /modelos/zeekr-7x/; }
    location = /noticias.php    { return 301 /noticias/; }
    location = /nosotros.php    { return 301 /nosotros/; }
    location ~ ^/(?:asociacion-qualcomm|audio-premium|ces-2025|diferencias-traccion|luces-inteligentes|noticia1|noticia2|revolucion-electrica|suvelectrico)\.php$ { return 301 /noticias/; }

    # Panel de contenido (Directus, app Coolify "directus", alias de red "directus").
    # Vive bajo /cms/ y el prefijo se quita antes de pasarle el pedido. No se sirve directo en /admin
    # porque Directus arma la URL de su API cortando la ruta en "/admin": la API quedaría en la raíz
    # del sitio. /admin es solo el atajo para los editores (conserva la subruta).
    location = /admin   { return 302 /cms/admin/; }
    location ^~ /admin/ { return 302 /cms$request_uri; }
    location = /cms     { return 302 /cms/admin/; }
    location ^~ /cms/ {
        # "directus" se resuelve en cada pedido (DNS interno de Docker) y no al arrancar: si el panel
        # está caído o redesplegando, nginx arranca igual y el sitio sigue; solo /cms/ da 502.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $directus_upstream http://directus:8055;
        rewrite ^/cms(/.*)$ $1 break;
        proxy_pass $directus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 30m;      # FILES_MAX_UPLOAD_SIZE de Directus = 25mb
        charset off;                   # no tocar el Content-Type que manda Directus
        proxy_hide_header X-Powered-By;
        # Sin la CSP del sitio: Directus manda la suya (la del sitio le rompería el panel).
        # Como este bloque define add_header, no hereda los del server: se repiten los que aplican.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Estáticos versionados por hash/derivados: caché larga
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|css|js|woff2|mp4|pdf)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri @baked_static;
    }

    location = /sitemap.xml { add_header Cache-Control "no-cache"; try_files $uri @baked_nocache; }
    location = /robots.txt  { add_header Cache-Control "no-cache"; try_files $uri @baked_nocache; }
    location = /site.webmanifest { add_header Cache-Control "public, max-age=86400"; types { } default_type application/manifest+json; try_files $uri @baked_manifest; }

    # HTML: siempre revalidar; sin fallback a index (evita soft-404)
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/ @baked_html;
    }

    # ---- Red de seguridad: copia de la imagen (ver arriba). Un @baked_* por juego de cabeceras. ----
    # HTML y todo lo que cae en "location /" o en el de index.html
    location @baked_html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/ =404;
    }
    # /en|pt|zh/…: igual que el anterior, con el 404 del idioma ($lang viene del location del idioma)
    location @baked_lang {
        root /usr/share/nginx/html;
        error_page 404 /$lang/404.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/ =404;
    }
    # Estáticos (imágenes, css, js, fuentes)
    location @baked_static {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }
    # Páginas de error (404.html y las de cada idioma): sin add_header propio, igual que sus locations → las del server
    location @baked_error {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location @baked_nocache {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location @baked_manifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }
}

# Vista previa de borradores (botón "Vista previa" del panel): la release que apunta
# /srv/sites/zeekr/preview. Nunca indexable, sin caché y sin red de seguridad: lo que no está en la
# vista previa da 404, así se ve exactamente lo que se va a publicar. Misma CSP que producción para que
# lo que se ve acá sea lo que se va a ver en zeekrlife.com.py.
server {
    listen 80;
    server_name preview-zeekr.santarosa.lat;
    root /srv/sites/zeekr/preview;
    index index.html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json text/plain text/xml application/xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml application/manifest+json image/svg+xml text/plain;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;

    # Ningún buscador tiene nada que hacer acá (además del X-Robots-Tag)
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    location ~ \.(?:py|toml|md|lock|mjs)$ { return 404; }
    location ~ ^/_(?:headers|redirects)$ { return 404; }
    location = /site.webmanifest { types { } default_type application/manifest+json; }

    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ ^/(en|pt|zh)/404\.html$ { internal; }
    # Sin add_header propio: hereda todas las del server (incluidas noindex y no-store)
    location ~ ^/(?<lang>en|pt|zh)/ {
        error_page 404 /$lang/404.html;
        try_files $uri $uri/ =404;
    }
    location / { try_files $uri $uri/ =404; }
}

# admin.santarosa.lat fue el primer dominio del panel (19/09/2026). Desde el 24/09 Directus vive en
# zeekrlife.com.py/cms y ya no tiene dominio propio en Coolify: este host solo redirige para que los
# enlaces viejos no terminen en una interfaz rota. Va después del server principal, que sigue siendo
# el default para cualquier otro Host.
server {
    listen 80;
    server_name admin.santarosa.lat;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 302 https://zeekrlife.com.py/admin;
}
