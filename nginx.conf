# ZEEKR Paraguay — sitio estático (Coolify → Traefik → este nginx)

# El alias de staging no debe indexarse; solo el dominio real.
map $host $robots_tag {
    default                 "noindex, nofollow";
    zeekrlife.com.py        "";
    www.zeekrlife.com.py    "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml application/manifest+json image/svg+xml text/plain;

    # Cabeceras de seguridad (se repiten por bloque: add_header no se hereda si el location define alguna)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag $robots_tag always;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json text/plain text/xml application/xml image/svg+xml;

    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ ^/(en|pt|zh)/404\.html$ { internal; }
    location ~ ^/(?<lang>en|pt|zh)/ {
        error_page 404 /$lang/404.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/ =404;
    }

    # /index.html y /carpeta/index.html pedidos explícitamente → URL canónica (el index interno no redirige)
    location ~ ^(?<dir>.*/)index\.html$ {
        if ($request_uri ~ "^[^?]*/index\.html") { return 301 $dir; }
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
    }

    # Archivos del generador / de Pages nunca se sirven
    location ~ \.(?:py|toml|md|lock|mjs)$ { return 404; }
    location ~ ^/(?:functions|api)/ { return 404; }
    location ~ ^/_(?:headers|redirects)$ { return 404; }

    # Redirecciones 301 desde las URLs del sitio anterior
    location = /zeekr001.html   { return 301 /modelos/zeekr-001/; }
    location = /zeekrx.html     { return 301 /modelos/zeekr-x/; }
    location = /zeekr7x.html    { return 301 /modelos/zeekr-7x/; }
    location = /noticias.html   { return 301 /noticias/; }
    location = /nosotros.html   { return 301 /nosotros/; }

    # Estáticos versionados por hash/derivados: caché larga
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|css|js|woff2|mp4|pdf)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri =404;
    }

    location = /sitemap.xml { add_header Cache-Control "no-cache"; }
    location = /robots.txt  { add_header Cache-Control "no-cache"; }
    location = /site.webmanifest { add_header Cache-Control "public, max-age=86400"; types { } default_type application/manifest+json; }

    # HTML: siempre revalidar; sin fallback a index (evita soft-404)
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/ =404;
    }
}
